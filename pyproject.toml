[project]
name = "data-api-challenge"
version = "0.1.0"
description = "Extração OpenWeather, consulta de dados climáticos e persistência em PostgreSQL."
readme = "README.md"
authors = [
    { name = "Ariel Franca", email = "france.dev@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.10.0",
    "sqlmodel>=0.0.24",
    "uvicorn[standard]>=0.35.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
